basePath: /
definitions:
  controller.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  controller.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  domain.Ability:
    properties:
      notes:
        type: string
      type:
        type: string
    type: object
  domain.Character:
    properties:
      abilities:
        items:
          $ref: '#/definitions/domain.Ability'
        type: array
      alias:
        type: string
      devilFruit:
        $ref: '#/definitions/domain.DevilFruit'
      firstAppearance:
        type: string
      hakiAbilities:
        items:
          $ref: '#/definitions/domain.HakiAbility'
        type: array
      id:
        type: string
      name:
        type: string
      notes:
        type: string
      role:
        type: string
      species:
        type: string
    type: object
  domain.DevilFruit:
    properties:
      description:
        type: string
      name:
        type: string
      type:
        type: string
    type: object
  domain.HakiAbility:
    properties:
      awakened:
        type: boolean
      hakiType:
        type: string
      notes:
        type: string
      proficiency:
        type: string
    type: object
  domain.Island:
    properties:
      description:
        type: string
      id:
        type: string
      name:
        type: string
      notable_characters:
        items:
          type: string
        type: array
      region:
        type: string
      x:
        type: number
      "y":
        type: number
    type: object
host: localhost:8080
info:
  contact:
    name: William Luna
  description: API REST para gestionar personajes e islas del mundo de One Piece.
    Proyecto de estudio con Clean Architecture en Go + Firestore.
  license:
    name: MIT
  title: One Piece API
  version: "1.0"
paths:
  /api/characters:
    get:
      description: Retorna todos los personajes almacenados en Firestore
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/domain.Character'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Listar personajes
      tags:
      - characters
    post:
      consumes:
      - application/json
      description: Crea un nuevo personaje con UUID autogenerado
      parameters:
      - description: Datos del personaje
        in: body
        name: character
        required: true
        schema:
          $ref: '#/definitions/domain.Character'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/controller.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/domain.Character'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Crear personaje
      tags:
      - characters
  /api/characters/{id}:
    delete:
      description: Elimina un personaje y todos sus datos normalizados
      parameters:
      - description: UUID del personaje
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Eliminar personaje
      tags:
      - characters
    get:
      description: Retorna un personaje específico dado su UUID
      parameters:
      - description: UUID del personaje
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/domain.Character'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Obtener personaje por ID
      tags:
      - characters
    put:
      consumes:
      - application/json
      description: Actualiza un personaje existente por ID
      parameters:
      - description: UUID del personaje
        in: path
        name: id
        required: true
        type: string
      - description: Datos actualizados
        in: body
        name: character
        required: true
        schema:
          $ref: '#/definitions/domain.Character'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/domain.Character'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Actualizar personaje
      tags:
      - characters
  /api/characters/devil-fruits:
    get:
      description: Retorna solo los personajes que poseen una Fruta del Diablo
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/domain.Character'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Personajes con Fruta del Diablo
      tags:
      - characters
  /api/characters/search:
    get:
      description: 'Búsqueda por prefix en Firestore (case-sensitive). Ej: "Monkey"
        encuentra "Monkey D. Luffy"'
      parameters:
      - description: Prefijo del nombre a buscar
        in: query
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/domain.Character'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Buscar personajes por nombre
      tags:
      - characters
  /api/islands:
    get:
      description: Retorna las 30 islas canónicas del mundo de One Piece con coordenadas
        2D
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Island'
            type: array
      summary: Listar todas las islas
      tags:
      - islands
  /api/islands/{id}:
    get:
      description: 'Retorna el detalle de una isla dado su slug (ej: water-7, laugh-tale)'
      parameters:
      - description: 'Slug de la isla (ej: water-7)'
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Island'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener isla por ID
      tags:
      - islands
  /api/islands/nearest:
    get:
      description: 'Dado un punto (x,y) del mapa, retorna la isla más cercana usando
        un índice Quadtree 2D. Coordenadas: X 0-10000 (Oeste→Este), Y 0-5000 (Sur→Norte).
        La Grand Line corre en Y≈2500.'
      parameters:
      - description: Coordenada X del mapa (0-10000)
        example: 4300
        in: query
        name: x
        required: true
        type: number
      - description: Coordenada Y del mapa (0-5000)
        example: 2500
        in: query
        name: "y"
        required: true
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Island'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Isla más cercana (Quadtree)
      tags:
      - islands
  /api/islands/region/{region}:
    get:
      description: Filtra islas por región (East Blue, Grand Line, New World, Sky
        Islands, Red Line)
      parameters:
      - description: Nombre de la región
        in: path
        name: region
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Island'
            type: array
      summary: Islas por región
      tags:
      - islands
securityDefinitions:
  ApiKeyAuth:
    description: Requerido para POST, PUT y DELETE. Configura la variable de entorno
      API_KEY en el servidor.
    in: header
    name: X-API-Key
    type: apiKey
swagger: "2.0"
